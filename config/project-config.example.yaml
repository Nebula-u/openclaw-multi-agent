# project-config.example.yaml
# 复制为 project-config.yaml（本地，不提交）并按目标业务项目填写。
# 所有路径必须是规范化绝对路径；StateGraph bootstrap 会校验仓库根与初始 commit。

schema_version: 1

# ---- 目标业务项目 ----
target_project:
  # 必填：目标业务项目根目录的绝对路径。
  # Windows 示例: "D:\\work\\my-service"
  # POSIX  示例: "/home/user/work/my-service"
  root_abs: "D:\\work\\REPLACE-ME"

  # 目标项目主语言（提示用途；实际以仓库真实配置文件为准，不据此猜测命令）。
  # 可选值: python | java | javascript | typescript | c | cpp | go | rust | dotnet | mixed
  primary_language: "mixed"

# ---- 运行时根目录（安装脚本创建；相对值相对项目根解析）----
runtime_root_abs: "D:\\MicroConnect\\project\\openclaw-multi-agent\\runtime"

# ---- 覆盖默认策略（可选）----
policy_overrides:
  rework:
    max_attempts: 3
  gates:
    review:
      medium_blocks: false

# ---- 测试命令来源（只允许以下来源；不得凭语言猜测）----
test_command_sources:
  - user_configured        # 用户在本文件显式配置
  - project_build_config   # 项目自带 package/build 文件
  - approved_test_strategy # architect-agent 已批准的测试策略

# 若在此显式配置测试命令，必须逐条给出（在目标项目/worktree 内执行）。
explicit_test_commands: []
  # - name: "unit"
  #   argv: ["npm", "test"]
  # - name: "build"
  #   argv: ["npm", "run", "build"]
